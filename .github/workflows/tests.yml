name: tests

on:
  push:
    branches: [main, '2.x', '2.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl, sodium, sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Configure the Nova repository credentials
        # Nova is a paid, private Composer repository. Without this the whole
        # matrix fails with an opaque HTTP 402 rather than a clear auth error.
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [ -z "$NOVA_USERNAME" ] || [ -z "$NOVA_LICENSE_KEY" ]; then
            echo "::error::NOVA_USERNAME and NOVA_LICENSE_KEY repository secrets are required."
            exit 1
          fi
          composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"

      - name: Constrain Laravel
        run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci

  databases:
    # SQLite cannot exercise the decisions that only matter on a real driver:
    # the 64-character credential-id hash index, JSON columns, and the
    # conditional-UPDATE claim semantics that replay protection depends on.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.4
          - db: pgsql
            image: postgres:16

    name: ${{ matrix.db }}

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports: ['3306:3306', '5432:5432']
        options: >-
          --health-cmd="exit 0"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl, sodium, mysql, pgsql, pdo_mysql, pdo_pgsql, mbstring
          coverage: none

      - name: Configure the Nova repository credentials
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the suite
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          DB_PASSWORD: password
        run: vendor/bin/pest --ci
