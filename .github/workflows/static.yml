name: static analysis

on:
  push:
    branches: [main, '2.x', '2.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: pint + phpstan

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl, sodium, sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Configure the Nova repository credentials
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: composer config --global http-basic.nova.laravel.com "$NOVA_USERNAME" "$NOVA_LICENSE_KEY"

      - run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Analyse
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: built assets are in sync

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # `dist/` is gitignored during development and built on release, so this
      # job is what stops a stale bundle from ever being shipped — 1.x published
      # compiled assets that were months out of step with their source.
      - name: Assert the build is reproducible
        run: |
          if [ -n "$(git status --porcelain dist 2>/dev/null)" ]; then
            echo "::error::dist/ differs from a fresh build of resources/js."
            git --no-pager diff --stat dist
            exit 1
          fi
